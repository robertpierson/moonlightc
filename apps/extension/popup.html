<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>MoonlightC</title>
    <style>
      html { background: #f1f4f8; }
      body { margin: 0; width: 300px; font: 14px system-ui, sans-serif; color: #0b1530; background: linear-gradient(180deg, #fff, #f1f4f8); }
      main { display: grid; gap: 10px; padding: 14px; }
      h1 { margin: 0; font-size: 15px; display: flex; align-items: center; gap: 8px; }
      p { margin: 0; color: #4f5a74; }
      button { font: inherit; font-weight: 600; padding: 8px 12px; border-radius: 999px; border: 0; cursor: pointer; }
      .go { color: #fff; background: linear-gradient(180deg, #2a5bea, #1640c4 55%, #0e2f99); }
      .stop { background: #fff; color: #1640c4; border: 1px solid #d5dbe6; }
      button:focus-visible { outline: 2px solid #1d4fd8; outline-offset: 2px; }
      ul { margin: 0; padding-left: 16px; max-height: 140px; overflow: auto; font-size: 12px; color: #4f5a74; }
      h2 { margin: 4px 0 0; font-size: 12px; }
    </style>
  </head>
  <body>
    <main>
      <h1><img src="icons/32.png" width="20" height="20" alt="" />MoonlightC</h1>
      <p id="status">Checking this tab…</p>
      <button id="toggle" class="go" hidden></button>
      <button id="stopAll" class="stop" hidden>Stop sharing every tab</button>
      <p>Shortcut to stop everything: Alt+Shift+M</p>
      <h2>Recent activity</h2>
      <ul id="log"><li>Nothing yet.</li></ul>
    </main>
    <script src="popup.js" type="module"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>MoonlightC: allow this step?</title>
    <style>
      html { background: #f1f4f8; }
      body { margin: 0; font: 14px system-ui, sans-serif; color: #0b1530; background: linear-gradient(180deg, #fff, #f1f4f8); }
      main { display: grid; gap: 10px; padding: 18px; }
      h1 { margin: 0; font-size: 15px; }
      p { margin: 0; color: #4f5a74; }
      div { display: flex; gap: 8px; justify-content: flex-end; margin-top: 6px; }
      button { font: inherit; font-weight: 600; padding: 8px 14px; border-radius: 999px; cursor: pointer; }
      #deny { background: #fff; color: #1640c4; border: 1px solid #d5dbe6; }
      #allow { color: #fff; border: 0; background: linear-gradient(180deg, #2a5bea, #1640c4 55%, #0e2f99); }
      button:focus-visible { outline: 2px solid #1d4fd8; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <h1 id="what"></h1>
      <p id="site"></p>
      <p>Allow only if you asked for this.</p>
      <div><button id="deny" autofocus>Deny</button><button id="allow">Allow</button></div>
    </main>
    <script src="confirm.js" type="module"></script>
  </body>
</html>

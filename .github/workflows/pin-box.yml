name: Windows PIN box
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [apps/desktop/src/MoonlightCInput.cs, apps/desktop/src/credential-box.mjs, apps/desktop/src/health.mjs, apps/desktop/pin-helper/**, .github/workflows/pin-box.yml]

jobs:
  box:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the test tool
        shell: pwsh
        run: |
          $csc = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          & $csc /nologo /target:exe /out:Probe.exe /r:System.Windows.Forms.dll apps\desktop\pin-helper\Probe.cs
      - name: Run the boxes
        shell: pwsh
        run: pwsh -NoProfile -File apps/desktop/pin-helper/ci-test.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pin-box
          path: out/

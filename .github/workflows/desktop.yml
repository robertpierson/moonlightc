name: Desktop builds
# Builds installers for every platform and attaches them to a DRAFT GitHub release.
# Publishing the release is a manual step for the owner.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # One draft for the version, made before the builds start, so parallel builds don't each create their own.
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          v="v$(node -p "require('./apps/desktop/package.json').version")"
          gh release view "$v" > /dev/null 2>&1 || gh release create "$v" --draft --title "${v#v}" --notes "MoonlightC ${v#v}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  build:
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win nsis --x64 --arm64
          - os: macos-latest
            args: --mac dmg --arm64 --x64
          - os: ubuntu-latest
            args: --linux AppImage deb rpm --x64 -c.npmRebuild=true
          - os: ubuntu-24.04-arm
            args: --linux AppImage deb rpm --arm64 -c.npmRebuild=true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - if: startsWith(matrix.os, 'ubuntu')
        run: sudo apt-get update && sudo apt-get install -y rpm libarchive-tools libx11-dev libxtst-dev libpng-dev
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @moonc/desktop bundle-web
      - run: pnpm --filter @moonc/desktop exec electron-builder ${{ matrix.args }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - if: failure() && startsWith(matrix.os, 'macos')
        run: find apps/desktop/dist -path "*.app/*" -type l -exec ls -l {} \; | grep -v "Frameworks/.*Versions/Current\|Frameworks/.*/Resources ->\|Frameworks/.*/Libraries ->\|-> Versions/Current" | head -40
